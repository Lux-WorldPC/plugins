# VPN Access configd actions (M10): the scripts under scripts/OPNsense/Paart.
# maintenance is what the plugin's cron job runs every 15 minutes; reconcile is
# the report-only subset. Both carry a description, so both are offered in
# System > Settings > Cron; bootstrap runs at boot (plugins.inc.d/paart.inc) and,
# without a description, stays out of that list.
[maintenance]
command:/usr/local/opnsense/scripts/OPNsense/Paart/maintenance.php
parameters:
type:script_output
message:VPN Access maintenance (abandoned enrollments, rotation graces, reconciliation, audit retention)
description:VPN Access maintenance

[reconcile]
command:/usr/local/opnsense/scripts/OPNsense/Paart/maintenance.php reconcile
parameters:
type:script_output
message:VPN Access reconciliation report
description:VPN Access reconciliation (report only)

[bootstrap]
command:/usr/local/opnsense/scripts/OPNsense/Paart/bootstrap.php
parameters:
type:script_output
message:VPN Access store bootstrap (backup and migrations)
